<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chuletas de HTML y JavaScript</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F9; --panel:#FFFFFF; --ink:#16213A; --muted:#5B6781; --line:#D7DEEC;
  --code:#14213D; --accent:#D6336C; --on-accent:#fff;
  --t-text:#E6ECF8; --t-tag:#FF8FB5; --t-str:#9BE28F; --t-kw:#7DB7FF; --t-com:#7C8AA5; --t-num:#FFC66D;
  --head:'Bricolage Grotesque',system-ui,sans-serif; --mono:'JetBrains Mono',Consolas,monospace;
}
:root[data-theme="dark"]{ --bg:#0E1424; --panel:#17203A; --ink:#E8EDF9; --muted:#9AA7C4; --line:#2A3556; --code:#0A101F; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0E1424; --panel:#17203A; --ink:#E8EDF9; --muted:#9AA7C4; --line:#2A3556; --code:#0A101F; }
}
body[data-tab="js"]{ --accent:#F2B705; --on-accent:#16213D; }
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{background:var(--bg);color:var(--ink);font-family:var(--head);font-weight:500;line-height:1.5}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:2px solid var(--line);padding:14px 24px}
.top{max-width:1300px;margin:auto;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
h1{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin-right:auto}
h1 span{background:var(--accent);color:var(--on-accent);padding:0 .35em;border-radius:6px}
.tabs{display:flex;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.tabs button{font:700 1rem var(--head);border:0;background:none;color:var(--muted);padding:8px 20px;border-radius:8px;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--on-accent)}
.tabs small{opacity:.8;font-weight:500;margin-left:4px}
#q{font:500 1rem var(--head);padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);width:240px}
#q:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.theme{font-size:1.1rem;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.wrap{max-width:1300px;margin:auto;padding:24px;display:grid;grid-template-columns:210px 1fr;gap:28px}
nav{position:sticky;top:110px;align-self:start;display:flex;flex-direction:column;gap:4px}
nav a{color:var(--muted);text-decoration:none;font-weight:700;padding:8px 12px;border-left:4px solid var(--line);border-radius:0 8px 8px 0}
nav a:hover{color:var(--ink);border-left-color:var(--accent);background:var(--panel)}
section{margin-bottom:42px}
section h2{font-size:1.5rem;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
section h2::before{content:"";width:14px;height:28px;background:var(--accent);border-radius:4px}
.sub{color:var(--muted);margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:18px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px}
.ch h3{font-size:1.05rem;font-weight:700}
.copy{font:700 .85rem var(--head);border:2px solid var(--accent);background:none;color:var(--ink);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.copy:hover,.copy.ok{background:var(--accent);color:var(--on-accent)}
pre{background:var(--code);color:var(--t-text);font:400 .84rem/1.6 var(--mono);padding:14px;overflow-x:auto;cursor:copy;flex:1;tab-size:2}
.k-tag{color:var(--t-tag)}.k-str{color:var(--t-str)}.k-kw{color:var(--t-kw)}.k-com{color:var(--t-com);font-style:italic}.k-num{color:var(--t-num)}
.desc{padding:12px 14px;font-size:.92rem;color:var(--muted);border-top:2px solid var(--line)}
.desc b{color:var(--ink)}
.empty{display:none;text-align:center;padding:60px 0;color:var(--muted);font-size:1.1rem}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,90px);background:var(--ink);color:var(--bg);padding:10px 22px;border-radius:30px;font-weight:700;transition:transform .25s;z-index:50}
#toast.show{transform:translate(-50%,0)}
@media (max-width:860px){
  .wrap{grid-template-columns:1fr;padding:16px}
  nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  nav a{white-space:nowrap;border-left:0;border-bottom:4px solid var(--line);border-radius:8px 8px 0 0}
  .grid{grid-template-columns:1fr}
  #q{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-tab="html">
<header>
  <div class="top">
    <h1>Chuletas de <span id="ttl">HTML</span></h1>
    <div class="tabs" role="tablist">
      <button id="tHtml" class="on" role="tab">HTML <small id="cHtml"></small></button>
      <button id="tJs" role="tab">JavaScript <small id="cJs"></small></button>
    </div>
    <input id="q" type="search" placeholder="Buscar: map, form, fetch..." aria-label="Buscar">
    <button class="theme" id="theme" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
  </div>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="toast">Código copiado</div>

  ["fetch con async/await", "Pide datos a una API y los convierte de JSON a objeto.",
`async function cargar() {
  try {
    const res = await fetch("https://api.ejemplo.com/datos");
    if (!res.ok) throw new Error("Error " + res.status);
    const datos = await res.json();
    console.log(datos);
  } catch (err) {
    console.error(err.message);
  }
}`],
  ["Enviar datos (POST)", "Manda un objeto JSON al servidor.",
`fetch("/api/usuarios", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ nombre: "Ana" })
});`],
  ["Promise.all", "Espera a varias tareas a la vez.",
`const [a, b] = await Promise.all([
  fetch("/a").then(r => r.json()),
  fetch("/b").then(r => r.json())
]);`],
  ["localStorage", "Guarda datos en el navegador aunque cierres la pestaña (solo texto).",
`localStorage.setItem("tema", "oscuro");
localStorage.getItem("tema");
localStorage.removeItem("tema");
// objetos: usa JSON
localStorage.setItem("user", JSON.stringify(user));
const u = JSON.parse(localStorage.getItem("user"));`],
  ["try / catch", "Captura errores sin que el programa se detenga.",
`try {
  JSON.parse("no es json");
} catch (error) {
  console.error("Falló:", error.message);

  console.log("Siempre se ejecuta");

 ]],
]};

/* ===== LÓGICA ===== */
const $ = s => document.querySelector(s);
let tab = "html";

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const RX = /(&lt;!--[\s\S]*?--&gt;|\/\/.*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b(?:const|let|var|function|return|if|else|for|while|of|in|new|class|async|await|try|catch|finally|throw|switch|case|break|default|this|true|false|null|undefined|delete)\b)|(&lt;\/?[a-zA-Z0-9-]+)|(\b\d+(?:\.\d+)?\b)/g;
const hl = code => esc(code).replace(RX, (m,c,s,k,t,n) =>
  c ? `<span class="k-com">${m}</span>` : s ? `<span class="k-str">${m}</span>` :
  k ? `<span class="k-kw">${m}</span>` : t ? `<span class="k-tag">${m}</span>` :
  `<span class="k-num">${m}</span>`);

const count = k => DATA[k].reduce((a, s) => a + s[2].length, 0);
$("#cHtml").textContent = count("html");
$("#cJs").textContent = count("js");

function render() {
  const q = $("#q").value.trim().toLowerCase();
  const main = $("#main"), nav = $("#nav");
  main.innerHTML = ""; nav.innerHTML = "";
  let shown = 0;
  DATA[tab].forEach(([name, sub, cards], i) => {
    const list = cards.filter(([t, d, c]) => !q || (t + d + c).toLowerCase().includes(q));
    if (!list.length) return;
    shown += list.length;
    const sec = document.createElement("section");
    sec.id = "s" + i;
    sec.innerHTML = `<h2>${name}</h2><p class="sub">${sub}</p><div class="grid"></div>`;
    list.forEach(([t, d, c]) => {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `<div class="ch"><h3>${t}</h3><button class="copy">Copiar</button></div>
        <pre title="Haz clic para copiar"><code>${hl(c)}</code></pre>
        <p class="desc"><b>Qué hace:</b> ${d}</p>`;
      const btn = card.querySelector(".copy");
      const go = () => copiar(c, btn);
      btn.addEventListener("click", go);
      card.querySelector("pre").addEventListener("click", go);
      sec.querySelector(".grid").append(card);
    });
    main.append(sec);
    nav.insertAdjacentHTML("beforeend", `<a href="#s${i}">${name}</a>`);
  });
  if (!shown) main.innerHTML = `<p class="empty" style="display:block">No hay resultados para “${esc(q)}”.</p>`;
}

function copiar(texto, btn) {
  const ok = () => {
    btn.textContent = "¡Copiado!"; btn.classList.add("ok");
    const t = $("#toast"); t.classList.add("show");
    setTimeout(() => { btn.textContent = "Copiar"; btn.classList.remove("ok"); t.classList.remove("show"); }, 1400);
  };
  if (navigator.clipboard && window.isSecureContext !== false) {
    navigator.clipboard.writeText(texto).then(ok).catch(() => viejo(texto, ok));
  } else viejo(texto, ok);
}
function viejo(texto, ok) {
  const ta = document.createElement("textarea");
  ta.value = texto; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.append(ta); ta.select();
  try { document.execCommand("copy"); ok(); } catch (e) {}
  ta.remove();
}

function setTab(t) {
  tab = t;
  document.body.dataset.tab = t;
  $("#tHtml").classList.toggle("on", t === "html");
  $("#tJs").classList.toggle("on", t === "js");
  $("#ttl").textContent = t === "html" ? "HTML" : "JavaScript";
  window.scrollTo(0, 0);
  render();
}
$("#tHtml").onclick = () => setTab("html");
$("#tJs").onclick = () => setTab("js");
$("#q").addEventListener("input", render);

$("#theme").onclick = () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#0E1424";
  root.dataset.theme = dark ? "light" : "dark";
};

render();
</script>
